
    <section class="bell-notify" aria-labelledby="bellNotifyTitle">
      <div class="bell-copy">
        <p class="kicker">FRESH DROP ALERTS</p>
        <h2 id="bellNotifyTitle">Subscribe to Boojee</h2>
        <p>Turn on cafe alerts for small-batch pastries, seasonal drinks and counter specials. And get our newsletter.</p>
        <form class="newsletter-form" onsubmit="event.preventDefault(); const msg=this.querySelector('.newsletter-msg'); fetch('/api/newsletter', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: this.querySelector('input').value})}).then(r=>r.json()).then(d=>{msg.textContent=d.message; msg.style.color=d.message.includes('Successfully')?'#4caf50':'#f44336'; if(d.message.includes('Successfully')) this.reset();}).catch(()=>msg.textContent='Error');" style="margin-top: 25px; display: flex; gap: 10px; max-width: 400px;">
            <input type="email" placeholder="Enter your email" required style="flex:1; padding: 12px; background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 4px;">
            <button type="submit" style="padding: 0 20px; background: #fff; color: #000; border: none; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; border-radius: 4px; cursor:pointer;">Subscribe</button>
            <div class="newsletter-msg" style="position: absolute; margin-top: 50px; font-size: 13px;"></div>
        </form>
      </div>
      <div class="bell-stage">
        <div class="bell-container off" data-bell-toggle aria-pressed="false" aria-label="Turn cafe notifications on">
          <span class="rope"></span>
          <span class="bell-top"></span>
          <span class="bell-base"></span>
          <span class="bell-base bell-base-glow"></span>
          <span class="shadow-l1"></span>
          <span class="shadow-l2"></span>
          <span class="left-glow"></span>
          <span class="left-glow2"></span>
          <span class="r-glow"></span>
          <span class="r-glow2"></span>
          <span class="mid-ring"></span>
          <span class="mid-ring small"></span>
          <span class="glow"></span>
          <span class="glow2"></span>
          <span class="bell-buff-t"></span>
          <span class="bell-buff"></span>
          <span class="bell-btm"></span>
          <span class="bell-btm2"></span>
          <span class="bell-ring-container"><span class="bell-ring"></span><span class="bell-rays"></span></span>
          <span class="volumetric"><span class="vl"></span><span class="vr"></span></span>
        </div>
        <button class="notify-button" type="button" data-bell-button>Notify Me</button>
        <span class="grain" aria-hidden="true"></span>
      </div>
    </section>
    <footer style="background: var(--ink); color: #f7f3ed; padding: 50px max(5vw, 28px);">
      <div class="enhanced-footer" style="display: flex; justify-content: space-between; align-items: center; max-width: 1240px; margin: 0 auto;">
          <div>
              <p style="margin:0; color:#cfc4b6;">&copy; 2026 Boojee Cafe.</p>
          </div>

              <a href="terms.html" style="opacity: 0.7;">Terms of Service</a>
              <a href="blog.html" style="opacity: 0.7;">Blog</a>
          </div>
      </div>
    </footer>
