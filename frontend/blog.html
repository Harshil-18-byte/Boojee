<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog | Boojee Cafe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; margin-top: 40px; }
    .blog-card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; transition: transform 0.3s; }
    .blog-card:hover { transform: translateY(-5px); }
    .blog-image { width: 100%; height: 200px; object-fit: cover; background: #eee; }
    .blog-content { padding: 25px; }
    .blog-title { font-family: var(--serif); font-size: 1.8rem; margin: 0 0 10px; line-height: 1.2; }
    .blog-meta { font-size: 0.85rem; color: #888; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.05em; }
    .blog-excerpt { color: #514b45; font-size: 1rem; line-height: 1.6; }
    html.dark-mode .blog-card { background: #211d19; border-color: #332b25; }
    html.dark-mode .blog-excerpt { color: #cfc4b6; }
  </style>
</head>
<body>
  <header class="header inner-header">
    <a class="wordmark" href="index.html">Boojee <span>CAFE</span></a>
    <nav class="nav">
      <a href="menu.html">Menu</a>
      <a href="visit.html">Visit</a>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
    </nav>
  </header>

  <main class="section" style="padding-top: 150px;">
    <h1 style="font-family: var(--serif); font-size: clamp(40px, 5vw, 68px); margin-bottom: 1rem;">The Journal</h1>
    <p style="font-size: 1.2rem; color: #625b54; max-width: 600px;">Thoughts, stories, and news from the Boojee team.</p>
    
    <div class="blog-grid" id="blogContainer">
        <!-- Posts injected here -->
        <p>Loading posts...</p>
    </div>
  </main>

  <footer style="background: var(--ink); color: #f7f3ed; margin-top: 80px;">
    <div class="newsletter-section">
        <div class="newsletter-content">
            <h2>Subscribe to Boojee <span class="bell-icon">🔔</span></h2>
            <p>Get the latest updates on new seasonal roasts, events, and cafe news.</p>
            <form class="newsletter-form" id="newsletterForm">
                <input type="email" id="newsletterEmail" placeholder="Enter your email address" required>
                <button type="submit">Subscribe</button>
            </form>
            <p id="newsletterMsg" class="newsletter-msg"></p>
        </div>
    </div>
    <div class="enhanced-footer">
        <div>
            <p>&copy; 2026 Boojee Cafe.</p>
        </div>
        <div class="footer-links">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
            <a href="blog.html">Blog</a>
        </div>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        // Fetch blog posts
        try {
            const res = await fetch('/api/blog');
            const data = await res.json();
            const container = document.getElementById('blogContainer');
            
            if (data.posts && data.posts.length > 0) {
                container.innerHTML = data.posts.map(post => `
                    <div class="blog-card">
                        ${post.image_url ? `<img src="${post.image_url}" class="blog-image" alt="${post.title}">` : `<div class="blog-image" style="display:flex; align-items:center; justify-content:center; color:#999; font-style:italic;">No Image</div>`}
                        <div class="blog-content">
                            <h2 class="blog-title">${post.title}</h2>
                            <div class="blog-meta">${new Date(post.created_at).toLocaleDateString()} &bull; By ${post.author_name}</div>
                            <div class="blog-excerpt">${post.content.substring(0, 150)}...</div>
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p>No posts published yet. Check back soon!</p>';
            }
        } catch (e) {
            document.getElementById('blogContainer').innerHTML = '<p>Error loading posts.</p>';
        }

        // Newsletter form
        document.getElementById('newsletterForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('newsletterEmail').value;
            const msg = document.getElementById('newsletterMsg');
            
            try {
                const res = await fetch('/api/newsletter', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                msg.textContent = data.message;
                msg.style.color = res.ok ? '#4caf50' : '#f44336';
                if(res.ok) document.getElementById('newsletterEmail').value = '';
            } catch (err) {
                msg.textContent = 'An error occurred. Please try again later.';
                msg.style.color = '#f44336';
            }
        };
    });
  </script>
</body>
</html>
